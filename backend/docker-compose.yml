version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: el_morenito_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: el_morenito_db
      MYSQL_USER: morenito_user
      MYSQL_PASSWORD: morenito_password_123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - morenito_net

volumes:
  db_data:

networks:
  morenito_net:
    driver: bridge
