<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Servicios | El Morenito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primario: #1e293b;
      --color-acento: #f59e0b;
      --color-fondo: #f8fafc;
      --color-tarjeta: #ffffff;
      --color-texto: #334155;
      --color-borde: #e2e8f0;
      --fuente-titulos: 'Barlow', sans-serif;
      --fuente-cuerpo: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--fuente-cuerpo); background-color: var(--color-fondo); color: var(--color-texto); }

    .admin-nav {
      background: var(--color-primario);
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-nav h2 { font-family: var(--fuente-titulos); font-size: 1.4rem; color: var(--color-acento); }
    .logo-img {
      height: 100px;
      width: auto;
      object-fit: contain;
      border-radius: 50px 50px;
    }

    .btn-cerrar {
      background: transparent;
      border: 1px solid #94a3b8;
      color: #fff;
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .contenedor-admin {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .card-formulario {
      background: #fff;
      padding: 1.8rem;
      border-radius: 8px;
      border: 1px solid var(--color-borde);
      margin-bottom: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .card-formulario h3 { margin-bottom: 1rem; color: var(--color-primario); font-family: var(--fuente-titulos); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-control {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--color-borde);
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .btn-crear {
      background: var(--color-acento);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }

    .tabla-servicios {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--color-borde);
    }

    .tabla-servicios th, .tabla-servicios td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--color-borde);
      font-size: 0.9rem;
    }

    .tabla-servicios th {
      background: #f1f5f9;
      color: var(--color-primario);
      font-family: var(--fuente-titulos);
    }

    .btn-eliminar {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 0.35rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="admin-nav">
    <img src="./../../public/assets/images/logo-el-morenito.png" alt="" class="logo-img" > 
    <h2>🔨 El Morenito | Panel Admin</h2>
    <div>
      <a href="servicios.html" style="color: #cbd5e1; margin-right: 1.2rem; text-decoration: none;">Ver Catálogo Público</a>
      <button class="btn-cerrar" id="btnCerrarSesion">Cerrar Sesión</button>
    </div>
  </header>

  <main class="contenedor-admin">
    <section class="card-formulario">
      <h3>Añadir Nuevo Trabajo / Servicio</h3>
      <form id="formNuevoServicio">
        <div class="form-grid">
          <input type="text" id="titulo" class="form-control" placeholder="Título del servicio" required>
          <input type="text" id="slug" class="form-control" placeholder="Slug (ej: reformas-locales)" required>
          <input type="text" id="categoria" class="form-control" placeholder="Categoría (ej: Reformas)" required>
          <input type="url" id="imagen_url" class="form-control" placeholder="URL imagen (https://...)" required>
        </div>
        <textarea id="descripcion" class="form-control" rows="3" placeholder="Descripción técnica del trabajo..." style="margin-bottom: 1rem;" required></textarea>
        <button type="submit" class="btn-crear">Guardar Servicio</button>
      </form>
    </section>

    <h3 style="margin-bottom: 1rem; color: var(--color-primario); font-family: var(--fuente-titulos); font-size: 1.3rem;">Servicios Activos en Base de Datos</h3>
    <table class="tabla-servicios">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Categoría</th>
          <th>Slug</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaCuerpo">
        <tr><td colspan="5" style="text-align: center;">Cargando servicios...</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    const token = localStorage.getItem('token_morenito');
    const rol = localStorage.getItem('usuario_rol');

    if (!token || rol !== 'admin') {
      localStorage.removeItem('token_morenito');
      localStorage.removeItem('usuario_rol');
      window.location.href = 'login.html';
    }

    document.getElementById('btnCerrarSesion').addEventListener('click', () => {
      localStorage.removeItem('token_morenito');
      window.location.href = 'login.html';
    });

    async function cargarLista() {
      try {
        const res = await fetch('http://localhost:5000/api/servicios?limite=100');
        const data = await res.json();
        const tbody = document.getElementById('tablaCuerpo');

        if (data.exito && data.datos) {
          tbody.innerHTML = data.datos.map(s => `
            <tr>
              <td><strong>#${s.id}</strong></td>
              <td>${s.titulo}</td>
              <td><span style="background:#e2e8f0; padding:2px 8px; border-radius:4px; font-weight:600;">${s.categoria}</span></td>
              <td><code>${s.slug}</code></td>
              <td>
                <button class="btn-eliminar" onclick="eliminarServicio(${s.id})">Eliminar</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('formNuevoServicio').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nuevo = {
        titulo: document.getElementById('titulo').value,
        slug: document.getElementById('slug').value,
        categoria: document.getElementById('categoria').value,
        imagen_url: document.getElementById('imagen_url').value,
        descripcion: document.getElementById('descripcion').value
      };

      const res = await fetch('http://localhost:5000/api/servicios', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(nuevo)
      });

      if (res.ok) {
        alert('✅ Servicio creado con éxito');
        document.getElementById('formNuevoServicio').reset();
        cargarLista();
      } else {
        alert('❌ Error al crear servicio. Revisa los datos.');
      }
    });

    async function eliminarServicio(id) {
      if (!confirm(`¿Estás seguro de eliminar el servicio #${id}?`)) return;

      const res = await fetch(`http://localhost:5000/api/servicios/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.ok) {
        cargarLista();
      } else {
        alert('❌ Error al eliminar el servicio.');
      }
    }

    cargarLista();
  </script>
</body>
</html>
