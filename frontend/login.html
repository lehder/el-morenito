<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | El Morenito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primario: #1e293b;
      --color-acento: #f59e0b;
      --color-acento-hover: #d97706;
      --color-fondo: #f8fafc;
      --color-tarjeta: #ffffff;
      --color-texto: #334155;
      --color-borde: #cbd5e1;
      --fuente-titulos: 'Barlow', sans-serif;
      --fuente-cuerpo: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--fuente-cuerpo);
      background-color: var(--color-fondo);
      color: var(--color-texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .login-card {
      background: var(--color-tarjeta);
      border: 1px solid var(--color-borde);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-family: var(--fuente-titulos);
      font-size: 1.8rem;
      color: var(--color-primario);
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.3rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-primario);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-borde);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--color-acento);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--color-acento);
      color: #fff;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--color-acento-hover);
    }

    .alerta {
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      display: none;
    }

    .alerta-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .link-volver {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--color-primario);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .link-volver:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <span style="font-size: 2.2rem;">🔨</span>
      <h1>Panel Administrativo</h1>
      <p style="font-size: 0.85rem; color: #64748b;">El Morenito Reformas & Obras</p>
    </div>

    <div class="alerta alerta-error" id="mensajeError"></div>

    <form id="formLogin">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" placeholder="admin@elmorenito.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Iniciar Sesión</button>
    </form>

    <a href="servicios.html" class="link-volver">← Volver al catálogo de servicios</a>
  </div>

  <script>
    const form = document.getElementById('formLogin');
    const mensajeError = document.getElementById('mensajeError');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeError.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Verificando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Credenciales directas de respaldo para entorno desplegado / demo
      if (email === "admin@elmorenito.com" && password === "admin123") {
        localStorage.setItem("token_morenito", "demo-admin-token-morenito");
        localStorage.setItem("usuario_rol", "admin");
        window.location.href = "admin.html";
        return;
      }

      try {
        const respuesta = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await respuesta.json();

        if (respuesta.ok && (data.token || (data.datos && data.datos.token))) {
          const token = data.token || data.datos.token;
          const usuario = data.usuario || (data.datos && data.datos.usuario);

          if (usuario && usuario.rol !== 'admin') {
            throw new Error('Acceso denegado: Tu cuenta no tiene permisos de Administrador.');
          }

          localStorage.setItem('token_morenito', token);
          localStorage.setItem('usuario_rol', usuario ? usuario.rol : 'admin');
          window.location.href = 'admin.html';
        } else {
          throw new Error(data.mensaje || 'Credenciales incorrectas');
        }
      } catch (error) {
        mensajeError.textContent = error.message;
        mensajeError.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
